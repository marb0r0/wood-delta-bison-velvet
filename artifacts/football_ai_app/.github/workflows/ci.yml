name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + unit tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff check
        run: ruff check src tests scripts

      - name: Unit tests
        run: pytest -q --tb=short -m "not integration"
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          APP_ENV: test

  integration:
    name: Integration tests (API + PostgreSQL)
    runs-on: ubuntu-latest
    needs: [backend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import time, sys
          import psycopg
          url = "postgresql://football:football@localhost:5432/football_ai_test"
          for i in range(30):
              try:
                  with psycopg.connect(url) as conn:
                      with conn.cursor() as cur:
                          cur.execute("SELECT 1")
                  print("Postgres is ready")
                  sys.exit(0)
              except Exception as e:
                  print(f"waiting ({i+1}/30): {e}")
                  time.sleep(1)
          print("Postgres did not become ready")
          sys.exit(1)
          PY

      - name: Integration tests
        run: pytest -q --tb=short -m integration tests/integration
        env:
          RUN_INTEGRATION: "1"
          DATABASE_URL: postgresql+psycopg://football:football@localhost:5432/football_ai_test
          APP_ENV: test
          CORS_ORIGINS: http://localhost:3000

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://example.com

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t football-ai-api:ci .
