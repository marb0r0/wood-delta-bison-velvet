name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/integration/**"
      - "migrations/**"
      - "pyproject.toml"
      - ".github/workflows/integration.yml"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-postgres:
    name: API + PostgreSQL 16
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import time, sys
          import psycopg
          url = "postgresql://football:football@localhost:5432/football_ai_test"
          for i in range(30):
              try:
                  with psycopg.connect(url) as conn:
                      with conn.cursor() as cur:
                          cur.execute("SELECT 1")
                  print("Postgres is ready")
                  sys.exit(0)
              except Exception as e:
                  print(f"waiting ({i+1}/30): {e}")
                  time.sleep(1)
          print("Postgres did not become ready")
          sys.exit(1)
          PY

      - name: Run integration suite
        run: |
          mkdir -p reports
          pytest -v --tb=short \
            -m integration \
            --junitxml=reports/integration-junit.xml \
            tests/integration
        env:
          RUN_INTEGRATION: "1"
          DATABASE_URL: postgresql+psycopg://football:football@localhost:5432/football_ai_test
          APP_ENV: test
          CORS_ORIGINS: http://localhost:3000

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-junit-py${{ matrix.python-version }}
          path: reports/integration-junit.xml
          if-no-files-found: ignore
