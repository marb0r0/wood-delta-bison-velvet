name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install & test
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check src tests
          pytest -q --tb=short
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          APP_ENV: test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Frontend build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          export VITE_API_URL="${VITE_API_URL:-https://example.com}"
          npm install
          npm run build

  deploy-render:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Deploy API
        env:
          HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_API_DEPLOY_HOOK not set — skip API deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "API deploy hook accepted"

      - name: Deploy Web
        env:
          HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_WEB_DEPLOY_HOOK not set — skip Web deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Web deploy hook accepted"
