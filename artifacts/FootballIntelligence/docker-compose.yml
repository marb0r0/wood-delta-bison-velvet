services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: football_ai
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./data:/app/data

volumes:
  postgres_data:
